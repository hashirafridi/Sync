# JVM heap for the Gradle daemon. Kept modest deliberately -- this machine is
# short on disk and RAM headroom; raise only if builds start OOM-ing.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is left OFF on purpose: it interacts badly with some
# KSP/Hilt setups and the failures are cryptic. Turn on once the build is stable.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
